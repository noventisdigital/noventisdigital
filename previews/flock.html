<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noventis - Migration preview</title>
    <style>
      :root {
        --bg: #0a0a0d;
        --text: #f1ece3;
        --muted: #aca393;
        --copper: #c4884d;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        touch-action: pan-y;
        cursor: grab;
      }
      .stage.dragging { cursor: grabbing; }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(900px 500px at 50% 50%, rgba(196, 136, 77, 0.05), transparent 70%);
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        pointer-events: none;
        padding: 6vh 2rem 0;
        text-align: center;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.24em;
        font-size: 0.72rem;
        color: var(--muted);
        margin: 0 0 0.6rem;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        margin: 0 0 0.6rem;
      }
      .caption {
        position: absolute;
        bottom: 3.6rem;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(172, 163, 147, 0.55);
        pointer-events: none;
      }
      .hud {
        position: absolute;
        bottom: 1.6rem;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 2.2rem;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(172, 163, 147, 0.7);
        pointer-events: none;
        font-variant-numeric: tabular-nums;
      }
      .hud strong {
        color: var(--copper);
        font-weight: 500;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="glow"></div>
      <div class="overlay">
        <p class="eyebrow">Preview · Migration</p>
        <h1>Three hundred birds, one rule each.</h1>
      </div>
      <div class="caption">Separation · alignment · cohesion · wind</div>
      <div class="hud">
        <span>Birds <strong>300</strong></span>
        <span>Season <strong id="season">Spring</strong></span>
      </div>
    </div>

    <script type="module">
      import * as THREE from '/vendor/three.module.min.js'

      const stage = document.getElementById('stage')
      const canvas = document.getElementById('view')
      const seasonEl = document.getElementById('season')

      const N = 300
      const YEAR = 40                 // seconds; the wind also completes one cycle per year
      const NEIGHBOUR = 3.2
      const SEPARATION = 1.3
      const MAX_SPEED = 5.5
      const MIN_SPEED = 2.2
      const MAX_FORCE = 18
      const W_SEP = 2.2
      const W_ALI = 1.0
      const W_COH = 0.8
      const BOUND = { x: 20, y: 5, z: 7 }
      const K_BOUND = 4.5
      const WIND = 1.6                // units per second, carried bodily
      const LEVEL = 0.4               // gentle pull towards level flight
      const FOV = 45

      // One keyframe per season, taken at the middle of the season.
      const SEASONS = [
        { name: 'Winter', sky: '#090b12', sun: '#8ea6cf', sunStrength: 0.55, ambient: '#7f8fa8', ambientStrength: 0.4, elevation: 0.22 },
        { name: 'Spring', sky: '#0a0d0c', sun: '#d6e6c6', sunStrength: 1.0, ambient: '#9fb59a', ambientStrength: 0.5, elevation: 0.7 },
        { name: 'Summer', sky: '#120f0a', sun: '#ffe2b0', sunStrength: 1.45, ambient: '#d9bb90', ambientStrength: 0.65, elevation: 1.1 },
        { name: 'Autumn', sky: '#0f0a08', sun: '#c4884d', sunStrength: 1.1, ambient: '#b58a62', ambientStrength: 0.55, elevation: 0.45 },
      ].map((s) => ({ ...s, skyC: new THREE.Color(s.sky), sunC: new THREE.Color(s.sun), ambientC: new THREE.Color(s.ambient) }))

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false })
      renderer.setClearColor('#0a0a0d')
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))

      const scene = new THREE.Scene()
      scene.fog = new THREE.Fog(0x0a0a0d, 30, 95)
      const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 300)

      const sun = new THREE.DirectionalLight(0xffffff, 1)
      scene.add(sun)
      const ambient = new THREE.AmbientLight(0xffffff, 0.5)
      scene.add(ambient)

      // A faint ground so the flock has something to move against.
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(400, 400),
        new THREE.MeshLambertMaterial({ color: '#1c1b1f' })
      )
      ground.rotation.x = -Math.PI / 2
      ground.position.y = -10
      scene.add(ground)

      // Bird: two slim triangles with a slight dihedral, nose along +z.
      const birdGeo = new THREE.BufferGeometry()
      birdGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        0, 0, 0.5, 0, 0, -0.22, -0.32, 0.08, -0.3,
        0, 0, 0.5, 0.32, 0.08, -0.3, 0, 0, -0.22,
      ]), 3))
      birdGeo.computeVertexNormals()
      const birds = new THREE.InstancedMesh(
        birdGeo,
        new THREE.MeshLambertMaterial({ color: '#f1ece3', side: THREE.DoubleSide }),
        N
      )
      birds.frustumCulled = false
      scene.add(birds)

      const pos = new Float32Array(N * 3)
      const vel = new Float32Array(N * 3)
      const phase = new Float32Array(N)
      for (let i = 0; i < N; i++) {
        const j = i * 3
        pos[j] = -9 + (Math.random() - 0.5) * 8
        pos[j + 1] = (Math.random() - 0.5) * 5
        pos[j + 2] = (Math.random() - 0.5) * 8
        vel[j] = 3 + Math.random() * 2
        vel[j + 1] = (Math.random() - 0.5)
        vel[j + 2] = (Math.random() - 0.5) * 2
        phase[i] = Math.random() * Math.PI * 2
      }

      const centroid = new THREE.Vector3()

      function stepBoids(dt, windX) {
        const R2 = NEIGHBOUR * NEIGHBOUR
        const S2 = SEPARATION * SEPARATION
        let sumX = 0, sumY = 0, sumZ = 0
        for (let i = 0; i < N; i++) {
          const a = i * 3
          const px = pos[a], py = pos[a + 1], pz = pos[a + 2]
          let vx = vel[a], vy = vel[a + 1], vz = vel[a + 2]
          let sx = 0, sy = 0, sz = 0
          let ax = 0, ay = 0, az = 0
          let cx = 0, cy = 0, cz = 0
          let count = 0
          for (let k = 0; k < N; k++) {
            if (k === i) continue
            const b = k * 3
            const dx = pos[b] - px, dy = pos[b + 1] - py, dz = pos[b + 2] - pz
            const d2 = dx * dx + dy * dy + dz * dz
            if (d2 > R2) continue
            count++
            ax += vel[b]; ay += vel[b + 1]; az += vel[b + 2]
            cx += pos[b]; cy += pos[b + 1]; cz += pos[b + 2]
            if (d2 < S2) {
              const d = Math.sqrt(d2) + 1e-3
              const w = (1 - d / SEPARATION) / d
              sx -= dx * w; sy -= dy * w; sz -= dz * w
            }
          }
          let fx = 0, fy = 0, fz = 0
          if (count > 0) {
            // Alignment: steer towards the neighbours' average heading.
            let len = Math.hypot(ax, ay, az) || 1
            fx += (ax / len * MAX_SPEED - vx) * W_ALI
            fy += (ay / len * MAX_SPEED - vy) * W_ALI
            fz += (az / len * MAX_SPEED - vz) * W_ALI
            // Cohesion: steer towards the local centre.
            cx = cx / count - px; cy = cy / count - py; cz = cz / count - pz
            len = Math.hypot(cx, cy, cz) || 1
            fx += (cx / len * MAX_SPEED - vx) * W_COH
            fy += (cy / len * MAX_SPEED - vy) * W_COH
            fz += (cz / len * MAX_SPEED - vz) * W_COH
          }
          const slen = Math.hypot(sx, sy, sz)
          if (slen > 0) {
            fx += (sx / slen * MAX_SPEED - vx) * W_SEP
            fy += (sy / slen * MAX_SPEED - vy) * W_SEP
            fz += (sz / slen * MAX_SPEED - vz) * W_SEP
          }
          const flen = Math.hypot(fx, fy, fz)
          if (flen > MAX_FORCE) {
            const s = MAX_FORCE / flen
            fx *= s; fy *= s; fz *= s
          }
          // Soft bound, a little wander, and a pull towards level flight.
          if (px > BOUND.x) fx -= (px - BOUND.x) * K_BOUND
          else if (px < -BOUND.x) fx += (-BOUND.x - px) * K_BOUND
          if (py > BOUND.y) fy -= (py - BOUND.y) * K_BOUND
          else if (py < -BOUND.y) fy += (-BOUND.y - py) * K_BOUND
          if (pz > BOUND.z) fz -= (pz - BOUND.z) * K_BOUND
          else if (pz < -BOUND.z) fz += (-BOUND.z - pz) * K_BOUND
          fx += (Math.random() - 0.5) * 2
          fy += (Math.random() - 0.5) * 2 - py * LEVEL
          fz += (Math.random() - 0.5) * 2

          vx += fx * dt; vy += fy * dt; vz += fz * dt
          const speed = Math.hypot(vx, vy, vz) || 1
          const clamped = Math.min(MAX_SPEED, Math.max(MIN_SPEED, speed))
          if (clamped !== speed) {
            const s = clamped / speed
            vx *= s; vy *= s; vz *= s
          }
          vel[a] = vx; vel[a + 1] = vy; vel[a + 2] = vz
          pos[a] = px + (vx + windX) * dt
          pos[a + 1] = py + vy * dt
          pos[a + 2] = pz + vz * dt
          sumX += pos[a]; sumY += pos[a + 1]; sumZ += pos[a + 2]
        }
        centroid.set(sumX / N, sumY / N, sumZ / N)
      }

      const dummy = new THREE.Object3D()
      const target = new THREE.Vector3()

      function placeBirds(time) {
        for (let i = 0; i < N; i++) {
          const j = i * 3
          dummy.position.set(pos[j], pos[j + 1], pos[j + 2])
          target.set(pos[j] + vel[j], pos[j + 1] + vel[j + 1], pos[j + 2] + vel[j + 2])
          dummy.lookAt(target)
          const flap = 0.3 + 1.1 * (0.5 + 0.5 * Math.sin(time * 9 + phase[i]))
          dummy.scale.set(1, flap, 1)
          dummy.updateMatrix()
          birds.setMatrixAt(i, dummy.matrix)
        }
        birds.instanceMatrix.needsUpdate = true
      }

      // Seasons: interpolate between the two nearest keyframes.
      const sky = new THREE.Color()
      let seasonIndex = -1

      function applySeason(yearTime) {
        const u = (yearTime / YEAR) * 4 - 0.5
        const k = Math.floor(((u % 4) + 4) % 4)
        const f = ((u % 1) + 1) % 1
        const a = SEASONS[k]
        const b = SEASONS[(k + 1) % 4]
        sky.lerpColors(a.skyC, b.skyC, f)
        renderer.setClearColor(sky)
        scene.fog.color.copy(sky)
        sun.color.lerpColors(a.sunC, b.sunC, f)
        sun.intensity = a.sunStrength + (b.sunStrength - a.sunStrength) * f
        ambient.color.lerpColors(a.ambientC, b.ambientC, f)
        ambient.intensity = a.ambientStrength + (b.ambientStrength - a.ambientStrength) * f
        const el = a.elevation + (b.elevation - a.elevation) * f
        const az = (yearTime / YEAR) * Math.PI * 2
        sun.position.set(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el)).multiplyScalar(60)
        const idx = Math.floor(yearTime / (YEAR / 4)) % 4
        if (idx !== seasonIndex) {
          seasonIndex = idx
          seasonEl.textContent = SEASONS[idx].name
        }
      }

      // Camera: slow orbit around a point that half-follows the flock; drag adds to it.
      let userTheta = 0
      let userPhi = 0
      let dist = 36
      const look = new THREE.Vector3()
      const wanted = new THREE.Vector3()
      let drag = null

      stage.addEventListener('pointerdown', (e) => {
        drag = { x: e.clientX, y: e.clientY }
        stage.classList.add('dragging')
      })
      stage.addEventListener('pointermove', (e) => {
        if (!drag) return
        userTheta -= (e.clientX - drag.x) * 0.005
        userPhi = THREE.MathUtils.clamp(userPhi + (e.clientY - drag.y) * 0.005, -0.2, 0.9)
        drag.x = e.clientX
        drag.y = e.clientY
      })
      const endDrag = () => {
        drag = null
        stage.classList.remove('dragging')
      }
      stage.addEventListener('pointerup', endDrag)
      stage.addEventListener('pointercancel', endDrag)
      stage.addEventListener('pointerleave', endDrag)

      function resize() {
        const w = stage.clientWidth || 1
        const h = stage.clientHeight || 1
        renderer.setSize(w, h, false)
        camera.aspect = w / h
        camera.updateProjectionMatrix()
        dist = 36 * Math.max(1, 0.85 / camera.aspect)
      }

      let raf = 0
      let last = 0
      let time = 0

      function frame(now) {
        if (document.hidden) {
          raf = 0
          return
        }
        const dt = Math.min(0.033, Math.max(0.001, (now - last) / 1000))
        last = now
        time += dt

        const yearTime = (time + 10) % YEAR
        const windX = WIND * Math.sin((yearTime / YEAR) * Math.PI * 2)
        stepBoids(dt, windX)
        placeBirds(time)
        applySeason(yearTime)

        wanted.copy(centroid).multiplyScalar(0.6)
        look.lerp(wanted, 1 - Math.exp(-dt * 0.8))
        const theta = time * 0.045 + userTheta
        const phi = 0.28 + userPhi
        camera.position.set(
          look.x + dist * Math.sin(theta) * Math.cos(phi),
          look.y + dist * Math.sin(phi),
          look.z + dist * Math.cos(theta) * Math.cos(phi)
        )
        camera.lookAt(look)

        renderer.render(scene, camera)
        raf = requestAnimationFrame(frame)
      }

      function start() {
        if (raf) return
        last = performance.now()
        raf = requestAnimationFrame(frame)
      }

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) start()
      })
      window.addEventListener('resize', resize)
      resize()
      start()
    </script>
  </body>
</html>
