<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noventis - Portrait in particles preview</title>
    <style>
      :root {
        --bg: #0a0a0d;
        --text: #f1ece3;
        --muted: #aca393;
        --copper: #c4884d;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        touch-action: pan-y;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(900px 500px at 50% 50%, rgba(196, 136, 77, 0.05), transparent 70%);
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        pointer-events: none;
        padding: 6vh 2rem 0;
        text-align: center;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.24em;
        font-size: 0.72rem;
        color: var(--muted);
        margin: 0 0 0.6rem;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        margin: 0 0 0.6rem;
      }
      .caption {
        position: absolute;
        bottom: 3.6rem;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(172, 163, 147, 0.55);
        pointer-events: none;
      }
      .hud {
        position: absolute;
        bottom: 1.6rem;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 2.2rem;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(172, 163, 147, 0.7);
        pointer-events: none;
        font-variant-numeric: tabular-nums;
      }
      .hud strong {
        color: var(--copper);
        font-weight: 500;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="glow"></div>
      <div class="overlay">
        <p class="eyebrow">Preview · Portrait in particles</p>
        <h1>A few thousand points, one person.</h1>
      </div>
      <div class="caption">Move the mouse through it</div>
      <div class="hud">
        <span>Points <strong id="points">0</strong></span>
      </div>
    </div>

    <script type="module">
      import * as THREE from '/vendor/three.module.min.js'

      const stage = document.getElementById('stage')
      const canvas = document.getElementById('view')
      const pointsEl = document.getElementById('points')
      const titleEl = document.querySelector('h1')
      const captionEl = document.querySelector('.caption')

      const SIZE = 400          // source image is 400 by 400
      const STEP = 4            // grid spacing in image pixels
      const THRESHOLD = 0.17    // pixels darker than this are skipped
      const DEPTH = 0.24        // z range: 12 percent of the cloud's width (2 units)
      const FOV = 36

      // Spring that returns a displaced point to its home, critically damped.
      const K = 6.25
      const C = 5
      // Cursor push: radius on the portrait plane and strength.
      const RADIUS = 0.28
      const FORCE = 8

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false })
      renderer.setClearColor('#0a0a0d')
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))

      const scene = new THREE.Scene()
      const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 50)
      let dist = 4
      let cloudY = 0

      const uniforms = {
        uMap: { value: makeSprite() },
        uScale: { value: 1 },
        uPulse: { value: 1 },
      }

      const vertexShader = `
        attribute vec3 aColor;
        attribute float aSize;
        attribute float aHeat;
        uniform float uScale;
        uniform float uPulse;
        varying vec3 vColor;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * uScale * uPulse / -mv.z;
          vColor = mix(aColor, vec3(0.769, 0.533, 0.302), aHeat * 0.8);
          gl_Position = projectionMatrix * mv;
        }`
      const fragmentShader = `
        uniform sampler2D uMap;
        varying vec3 vColor;
        void main() {
          float a = texture2D(uMap, gl_PointCoord).a;
          if (a < 0.02) discard;
          gl_FragColor = vec4(vColor, a);
        }`

      function makeSprite() {
        const c = document.createElement('canvas')
        c.width = c.height = 64
        const g = c.getContext('2d')
        const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32)
        grd.addColorStop(0, 'rgba(255, 255, 255, 1)')
        grd.addColorStop(0.3, 'rgba(255, 255, 255, 0.85)')
        grd.addColorStop(1, 'rgba(255, 255, 255, 0)')
        g.fillStyle = grd
        g.fillRect(0, 0, 64, 64)
        return new THREE.CanvasTexture(c)
      }

      // Point state. home is fixed; off and vel are the displacement spring; heat tints copper.
      let n = 0
      let geo = null
      let points = null
      let home, pos, off, vel, heat

      function sampleImage(image) {
        const c = document.createElement('canvas')
        c.width = c.height = SIZE
        const g = c.getContext('2d', { willReadFrequently: true })
        g.drawImage(image, 0, 0, SIZE, SIZE)
        const px = g.getImageData(0, 0, SIZE, SIZE).data
        return (x, y) => {
          const i = (y * SIZE + x) * 4
          return (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114) / 255
        }
      }

      // A soft disc, so the preview still runs if the image is missing.
      function sampleFallback() {
        return (x, y) => {
          const dx = x / SIZE - 0.5
          const dy = y / SIZE - 0.5
          return Math.max(0, 1 - Math.sqrt(dx * dx + dy * dy) * 2.6)
        }
      }

      function build(lum) {
        const homes = []
        const cols = []
        const sizes = []
        for (let y = STEP / 2; y < SIZE; y += STEP) {
          for (let x = STEP / 2; x < SIZE; x += STEP) {
            const v = lum(x, y)
            if (v < THRESHOLD) continue
            const jx = (Math.random() - 0.5) * STEP * 0.5
            const jy = (Math.random() - 0.5) * STEP * 0.5
            homes.push(((x + jx) / SIZE) * 2 - 1, 1 - ((y + jy) / SIZE) * 2, v * DEPTH)
            const lift = 0.2 + 0.8 * v
            cols.push(lift * 0.945, lift * 0.925, lift * 0.89)
            sizes.push(0.017 + 0.017 * v)
          }
        }
        n = homes.length / 3
        home = new Float32Array(homes)
        pos = new Float32Array(n * 3)
        off = new Float32Array(n * 3)
        vel = new Float32Array(n * 3)
        heat = new Float32Array(n)
        // Start scattered so the portrait assembles itself.
        for (let i = 0; i < n * 3; i++) {
          off[i] = (Math.random() - 0.5) * 2.4
          pos[i] = home[i] + off[i]
        }

        geo = new THREE.BufferGeometry()
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3))
        geo.setAttribute('aColor', new THREE.BufferAttribute(new Float32Array(cols), 3))
        geo.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(sizes), 1))
        geo.setAttribute('aHeat', new THREE.BufferAttribute(heat, 1))
        const mat = new THREE.ShaderMaterial({
          uniforms,
          vertexShader,
          fragmentShader,
          transparent: true,
          depthWrite: false,
        })
        points = new THREE.Points(geo, mat)
        points.frustumCulled = false
        points.position.y = cloudY
        scene.add(points)
        pointsEl.textContent = n
      }

      const img = new Image()
      img.onload = () => build(sampleImage(img))
      img.onerror = () => build(sampleFallback())
      img.src = '/images/john-byrne.png'

      function resize() {
        const w = stage.clientWidth || 1
        const h = stage.clientHeight || 1
        renderer.setSize(w, h, false)
        camera.aspect = w / h
        camera.updateProjectionMatrix()
        // Fit the cloud's 2-unit square into the band from 18 to 80 percent of the height,
        // narrowed if the tagline or caption reach into it, and no wider than the viewport.
        const bandTop = Math.max(0.2 * h, titleEl.getBoundingClientRect().bottom + 22)
        const bandBottom = Math.min(0.8 * h, captionEl.getBoundingClientRect().top - 8)
        const frac = Math.max(0.3, (bandBottom - bandTop) / h)
        const centre = (bandTop + bandBottom) / 2 / h
        const halfFov = Math.tan(THREE.MathUtils.degToRad(FOV / 2))
        const halfH = Math.max(1 / frac, 1 / (0.92 * camera.aspect))
        dist = halfH / halfFov
        cloudY = (0.5 - centre) * 2 * halfH
        if (points) points.position.y = cloudY
        uniforms.uScale.value = (h * renderer.getPixelRatio()) / (2 * halfFov)
      }

      // Pointer, projected onto the portrait plane each frame.
      const ndc = new THREE.Vector2()
      const ray = new THREE.Raycaster()
      const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0)
      const hit = new THREE.Vector3()
      let pointerOn = false
      let lastMove = -10

      function onMove(e) {
        const r = canvas.getBoundingClientRect()
        ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1)
        pointerOn = true
        lastMove = time
      }
      stage.addEventListener('pointermove', onMove)
      stage.addEventListener('pointerdown', onMove)
      stage.addEventListener('pointerleave', () => { pointerOn = false })
      stage.addEventListener('pointercancel', () => { pointerOn = false })
      stage.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') pointerOn = false })

      function step(dt, push, cx, cy) {
        const decay = Math.exp(-dt / 0.8)
        for (let i = 0; i < n; i++) {
          const j = i * 3
          let ox = off[j], oy = off[j + 1], oz = off[j + 2]
          let vx = vel[j], vy = vel[j + 1], vz = vel[j + 2]
          let ax = -K * ox - C * vx
          let ay = -K * oy - C * vy
          let az = -K * oz - C * vz
          let h = heat[i] * decay
          if (push > 0) {
            const dx = home[j] + ox - cx
            const dy = home[j + 1] + oy - cy
            const d2 = dx * dx + dy * dy
            if (d2 < RADIUS * RADIUS) {
              const d = Math.sqrt(d2) + 1e-4
              const w = 1 - d / RADIUS
              const f = w * FORCE * push
              ax += (dx / d) * f
              ay += (dy / d) * f
              az += f * 0.6
              h = Math.min(1, h + w * dt * 4)
            }
          }
          vx += ax * dt
          vy += ay * dt
          vz += az * dt
          ox += vx * dt
          oy += vy * dt
          oz += vz * dt
          off[j] = ox; off[j + 1] = oy; off[j + 2] = oz
          vel[j] = vx; vel[j + 1] = vy; vel[j + 2] = vz
          pos[j] = home[j] + ox
          pos[j + 1] = home[j + 1] + oy
          pos[j + 2] = home[j + 2] + oz
          heat[i] = h
        }
        geo.attributes.position.needsUpdate = true
        geo.attributes.aHeat.needsUpdate = true
      }

      let raf = 0
      let last = 0
      let time = 0

      function frame(now) {
        if (document.hidden) {
          raf = 0
          return
        }
        const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000))
        last = now
        time += dt

        const breath = Math.sin(time * 0.55)
        uniforms.uPulse.value = 1 + 0.05 * breath

        const th = 0.08 * Math.sin(time * 0.19)
        const ph = 0.05 * Math.sin(time * 0.13 + 1.3)
        camera.position.set(
          dist * Math.sin(th) * Math.cos(ph),
          dist * Math.sin(ph),
          dist * Math.cos(th) * Math.cos(ph)
        )
        camera.lookAt(0, 0, 0)
        camera.updateMatrixWorld()

        if (points) {
          points.scale.set(1 + 0.008 * breath, 1 + 0.008 * breath, 1 + 0.2 * breath)
          let push = 0
          let cx = 0
          let cy = 0
          if (pointerOn) {
            // The push fades when the cursor rests, so the hole closes behind it.
            push = Math.max(0, 1 - (time - lastMove) / 1.5)
            if (push > 0) {
              ray.setFromCamera(ndc, camera)
              if (ray.ray.intersectPlane(plane, hit)) {
                cx = hit.x
                cy = hit.y - points.position.y
              } else {
                push = 0
              }
            }
          }
          step(dt, push, cx, cy)
        }

        renderer.render(scene, camera)
        raf = requestAnimationFrame(frame)
      }

      function start() {
        if (raf) return
        last = performance.now()
        raf = requestAnimationFrame(frame)
      }

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) start()
      })
      window.addEventListener('resize', resize)
      resize()
      start()
    </script>
  </body>
</html>
