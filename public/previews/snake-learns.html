<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noventis - Snake learns preview</title>
    <style>
      :root {
        --bg: #0a0a0d;
        --text: #f1ece3;
        --muted: #aca393;
        --copper: #c4884d;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(900px 500px at 50% 50%, rgba(196, 136, 77, 0.04), transparent 70%),
          var(--bg);
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        pointer-events: none;
        padding: 6vh 2rem 0;
        text-align: center;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.24em;
        font-size: 0.72rem;
        color: var(--muted);
        margin: 0 0 0.6rem;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        margin: 0 0 0.6rem;
      }
      .hud {
        position: absolute;
        bottom: 2.8rem;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.4rem 2.2rem;
        padding: 0 1rem;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(172, 163, 147, 0.7);
        pointer-events: none;
      }
      .hud strong {
        color: var(--copper);
        font-weight: 500;
        letter-spacing: 0.1em;
        font-variant-numeric: tabular-nums;
      }
      .caption {
        position: absolute;
        bottom: 1.1rem;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(172, 163, 147, 0.5);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="scene"></canvas>
      <div class="overlay">
        <p class="eyebrow">Preview · Snake learns</p>
        <h1>It starts stupid.</h1>
      </div>
      <div class="hud">
        <span>Episode <strong id="episode">0</strong></span>
        <span>Score <strong id="score">0</strong></span>
        <span>Best <strong id="best">0</strong></span>
        <span>Epsilon <strong id="epsilon">1.00</strong></span>
      </div>
      <div class="caption">Q-learning · no rules given · never restarts</div>
    </div>

    <script>
      (() => {
        const canvas = document.getElementById('scene')
        const ctx = canvas.getContext('2d')
        const episodeEl = document.getElementById('episode')
        const scoreEl = document.getElementById('score')
        const bestEl = document.getElementById('best')
        const epsilonEl = document.getElementById('epsilon')
        const dpr = Math.min(window.devicePixelRatio || 1, 2)

        const N = 20
        const ALPHA = 0.1
        const GAMMA = 0.9
        const EPSILON_MIN = 0.02
        const EPSILON_DECAY = 0.99
        const REWARD_FOOD = 10
        const REWARD_DEATH = -10
        const REWARD_STEP = -0.1
        const STEPS_PER_SECOND = 2400
        const AVERAGE_WINDOW = 50
        const MAX_POINTS = 65536
        const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]
        const FONT = '600 10px -apple-system, system-ui, sans-serif'

        // State: danger straight, left, right (8) x heading (4) x food dx, dy sign (9).
        // Actions: straight, turn left, turn right.
        const Q = new Float32Array(8 * 4 * 9 * 3)

        let width = 0
        let height = 0
        const board = { x: 0, y: 0, size: 0, cell: 0 }
        const chart = { x: 0, y: 0, w: 0, h: 0 }

        function resize() {
          const rect = canvas.getBoundingClientRect()
          width = rect.width
          height = rect.height
          canvas.width = Math.floor(width * dpr)
          canvas.height = Math.floor(height * dpr)
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0)

          const top = height * 0.06 + 98
          const bottom = 88
          const side = Math.max(18, width * 0.035)
          const availW = width - side * 2
          const availH = Math.max(60, height - top - bottom)
          const gap = 30
          if (availW >= 280) {
            let size = Math.min(availH, (availW - gap) * 0.5)
            size = Math.max(N, Math.floor(size / N) * N)
            board.size = size
            board.x = side
            board.y = top + (availH - size) / 2
            chart.x = board.x + size + gap
            chart.w = width - side - chart.x
            chart.y = board.y
            chart.h = size
          } else {
            let size = Math.min(availW, Math.max(60, availH * 0.6))
            size = Math.max(N, Math.floor(size / N) * N)
            board.size = size
            board.x = (width - size) / 2
            board.y = top
            chart.x = side
            chart.w = availW
            chart.y = board.y + size + gap
            chart.h = Math.max(30, top + availH - chart.y)
          }
          board.cell = board.size / N
        }

        let snake = []
        const occupied = new Uint8Array(N * N)
        let dir = 0
        let food = [0, 0]
        let score = 0
        let best = 0
        let episode = 0
        let sinceFood = 0
        let epsilon = 1
        const trail = []

        function startEpisode() {
          occupied.fill(0)
          const c = N >> 1
          snake = [[c, c], [c - 1, c], [c - 2, c]]
          for (const [x, y] of snake) occupied[y * N + x] = 1
          dir = 0
          score = 0
          sinceFood = 0
          trail.length = 0
          placeFood()
        }

        function placeFood() {
          let k = Math.floor(Math.random() * (N * N - snake.length))
          for (let i = 0; i < N * N; i++) {
            if (occupied[i]) continue
            if (k-- === 0) {
              food = [i % N, (i / N) | 0]
              return
            }
          }
        }

        // The tail cell is safe: it moves away this step (food is never on the body).
        function blocked(x, y) {
          if (x < 0 || y < 0 || x >= N || y >= N) return true
          if (!occupied[y * N + x]) return false
          const tail = snake[snake.length - 1]
          return !(tail[0] === x && tail[1] === y)
        }

        function stateIndex() {
          const [hx, hy] = snake[0]
          const left = (dir + 3) & 3
          const right = (dir + 1) & 3
          const ds = blocked(hx + DIRS[dir][0], hy + DIRS[dir][1]) ? 1 : 0
          const dl = blocked(hx + DIRS[left][0], hy + DIRS[left][1]) ? 1 : 0
          const dr = blocked(hx + DIRS[right][0], hy + DIRS[right][1]) ? 1 : 0
          const fx = Math.sign(food[0] - hx) + 1
          const fy = Math.sign(food[1] - hy) + 1
          return (((ds * 2 + dl) * 2 + dr) * 4 + dir) * 9 + fx * 3 + fy
        }

        function greedy(s) {
          const i = s * 3
          let a = 0
          if (Q[i + 1] > Q[i + a]) a = 1
          if (Q[i + 2] > Q[i + a]) a = 2
          return a
        }

        function maxQ(s) {
          const i = s * 3
          return Math.max(Q[i], Q[i + 1], Q[i + 2])
        }

        function step() {
          const s = stateIndex()
          const a = Math.random() < epsilon ? (Math.random() * 3) | 0 : greedy(s)
          if (a === 1) dir = (dir + 3) & 3
          else if (a === 2) dir = (dir + 1) & 3

          const nx = snake[0][0] + DIRS[dir][0]
          const ny = snake[0][1] + DIRS[dir][1]
          let reward
          let terminal = false

          if (blocked(nx, ny)) {
            reward = REWARD_DEATH
            terminal = true
          } else {
            const eating = nx === food[0] && ny === food[1]
            if (!eating) {
              const tail = snake.pop()
              occupied[tail[1] * N + tail[0]] = 0
            }
            snake.unshift([nx, ny])
            occupied[ny * N + nx] = 1
            trail.push(nx, ny)
            if (eating) {
              score++
              sinceFood = 0
              reward = REWARD_FOOD
              if (score > best) best = score
              if (snake.length === N * N) terminal = true
              else placeFood()
            } else {
              sinceFood++
              reward = REWARD_STEP
              if (sinceFood > 100 + 5 * snake.length) {
                reward = REWARD_DEATH
                terminal = true
              }
            }
          }

          const qi = s * 3 + a
          const target = terminal ? reward : reward + GAMMA * maxQ(stateIndex())
          Q[qi] += ALPHA * (target - Q[qi])
          if (terminal) endEpisode()
        }

        // Learning curve. Entries are per episode until the array fills, then
        // pairs are averaged and each entry covers twice as many episodes.
        let scores = []
        let averages = []
        let stride = 1
        let pending = 0
        let pendingCount = 0

        function endEpisode() {
          episode++
          epsilon = Math.max(EPSILON_MIN, Math.pow(EPSILON_DECAY, episode))
          pending += score
          pendingCount++
          if (pendingCount >= stride) {
            pushPoint(pending / pendingCount)
            pending = 0
            pendingCount = 0
          }
          startEpisode()
        }

        function pushPoint(v) {
          scores.push(v)
          const n = scores.length
          const span = Math.min(n, AVERAGE_WINDOW)
          let sum = 0
          for (let i = n - span; i < n; i++) sum += scores[i]
          averages.push(sum / span)
          if (n >= MAX_POINTS) {
            const half = []
            for (let i = 0; i + 1 < n; i += 2) half.push((scores[i] + scores[i + 1]) / 2)
            scores = half
            averages = []
            let acc = 0
            for (let i = 0; i < half.length; i++) {
              acc += half[i]
              if (i >= AVERAGE_WINDOW) acc -= half[i - AVERAGE_WINDOW]
              averages.push(acc / Math.min(i + 1, AVERAGE_WINDOW))
            }
            stride *= 2
          }
        }

        function roundRect(x, y, w, h, r) {
          ctx.beginPath()
          ctx.moveTo(x + r, y)
          ctx.arcTo(x + w, y, x + w, y + h, r)
          ctx.arcTo(x + w, y + h, x, y + h, r)
          ctx.arcTo(x, y + h, x, y, r)
          ctx.arcTo(x, y, x + w, y, r)
          ctx.closePath()
        }

        let frameCount = 0

        function drawBoard() {
          const { x, y, size, cell } = board
          ctx.fillStyle = '#0c0c10'
          roundRect(x, y, size, size, 6)
          ctx.fill()
          ctx.strokeStyle = 'rgba(255, 245, 232, 0.08)'
          ctx.lineWidth = 1
          ctx.stroke()

          ctx.fillStyle = 'rgba(236, 225, 210, 0.05)'
          for (let r = 0; r < N; r++) {
            for (let c = 0; c < N; c++) {
              ctx.fillRect(x + c * cell + cell / 2 - 0.5, y + r * cell + cell / 2 - 0.5, 1, 1)
            }
          }

          // Where the head went during this frame, faint to bright.
          const n = trail.length / 2
          for (let i = 0; i < n; i++) {
            const a = 0.03 + 0.14 * (i / n)
            ctx.fillStyle = `rgba(241, 236, 227, ${a.toFixed(3)})`
            ctx.fillRect(x + trail[i * 2] * cell + cell * 0.3, y + trail[i * 2 + 1] * cell + cell * 0.3, cell * 0.4, cell * 0.4)
          }

          const pulse = (Math.sin(frameCount * 0.09) + 1) * 0.5
          const fr = cell * (0.22 + pulse * 0.12)
          const fx = x + food[0] * cell + cell / 2
          const fy = y + food[1] * cell + cell / 2
          const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr * 2.4)
          glow.addColorStop(0, 'rgba(196, 136, 77, 0.85)')
          glow.addColorStop(1, 'rgba(196, 136, 77, 0)')
          ctx.fillStyle = glow
          ctx.beginPath()
          ctx.arc(fx, fy, fr * 2.4, 0, Math.PI * 2)
          ctx.fill()
          ctx.fillStyle = 'rgba(236, 225, 210, 0.9)'
          ctx.beginPath()
          ctx.arc(fx, fy, fr * 0.5, 0, Math.PI * 2)
          ctx.fill()

          const pad = Math.max(1, cell * 0.08)
          const radius = Math.min(4, cell * 0.25)
          for (let i = snake.length - 1; i >= 0; i--) {
            const t = 1 - i / snake.length
            const alpha = 0.4 + 0.55 * Math.pow(t, 1.4)
            ctx.fillStyle = `rgba(241, 236, 227, ${alpha.toFixed(3)})`
            roundRect(x + snake[i][0] * cell + pad, y + snake[i][1] * cell + pad, cell - pad * 2, cell - pad * 2, radius)
            ctx.fill()
          }
          const head = snake[0]
          ctx.fillStyle = 'rgba(10, 10, 13, 0.95)'
          ctx.beginPath()
          ctx.arc(x + head[0] * cell + cell / 2, y + head[1] * cell + cell / 2, Math.max(1, cell * 0.09), 0, Math.PI * 2)
          ctx.fill()
        }

        let yMax = 5

        function drawSeries(data, cols, sx, sy) {
          const n = data.length
          ctx.beginPath()
          for (let c = 0; c < cols; c++) {
            const a = Math.floor((c * n) / cols)
            const b = Math.max(a + 1, Math.floor(((c + 1) * n) / cols))
            let m = 0
            for (let i = a; i < b; i++) m += data[i]
            m /= b - a
            if (c === 0) ctx.moveTo(sx(c), sy(m))
            else ctx.lineTo(sx(c), sy(m))
          }
          ctx.stroke()
        }

        function drawChart() {
          const { x, y, w, h } = chart
          if (w < 40 || h < 30) return
          ctx.strokeStyle = 'rgba(241, 236, 227, 0.1)'
          ctx.lineWidth = 1
          ctx.beginPath()
          ctx.moveTo(x + 0.5, y)
          ctx.lineTo(x + 0.5, y + h + 0.5)
          ctx.lineTo(x + w, y + h + 0.5)
          ctx.stroke()

          ctx.font = FONT
          ctx.letterSpacing = '0.16em'
          ctx.textBaseline = 'top'
          ctx.textAlign = 'left'
          ctx.fillStyle = 'rgba(172, 163, 147, 0.6)'
          ctx.fillText('SCORE PER EPISODE', x + 8, y + 4)
          ctx.fillStyle = 'rgba(196, 136, 77, 0.8)'
          ctx.fillText('50-EPISODE AVERAGE', x + 8, y + 18)
          ctx.textAlign = 'right'
          ctx.textBaseline = 'bottom'
          ctx.fillStyle = 'rgba(172, 163, 147, 0.5)'
          ctx.fillText(`${(scores.length * stride).toLocaleString('en-GB')} EPISODES`, x + w - 4, y + h - 3)

          const n = scores.length
          const target = Math.max(5, Math.ceil((best + 2) / 5) * 5)
          yMax += (target - yMax) * 0.08
          ctx.textAlign = 'right'
          ctx.textBaseline = 'top'
          ctx.fillText(String(Math.round(yMax)), x + w - 4, y + 4)
          if (n < 2) return

          const cols = Math.min(n, Math.floor(w))
          const sx = (c) => x + 1 + ((w - 2) * c) / (cols - 1)
          const sy = (v) => y + h - (v / yMax) * (h - 32)

          ctx.strokeStyle = 'rgba(241, 236, 227, 0.26)'
          ctx.lineWidth = 1
          drawSeries(scores, cols, sx, sy)

          ctx.strokeStyle = '#c4884d'
          ctx.lineWidth = 1.6
          ctx.lineJoin = 'round'
          drawSeries(averages, cols, sx, sy)

          const lastAvg = averages[averages.length - 1]
          ctx.fillStyle = '#c4884d'
          ctx.beginPath()
          ctx.arc(sx(cols - 1), sy(lastAvg), 2.5, 0, Math.PI * 2)
          ctx.fill()
        }

        function draw() {
          frameCount++
          ctx.clearRect(0, 0, width, height)
          drawBoard()
          drawChart()
          episodeEl.textContent = episode.toLocaleString('en-GB')
          scoreEl.textContent = score
          bestEl.textContent = best
          epsilonEl.textContent = epsilon.toFixed(2)
        }

        let running = false
        let rafId = 0
        let last = 0

        function frame(now) {
          if (!running) return
          const dt = Math.min(0.1, Math.max(0, (now - last) / 1000))
          last = now
          const steps = Math.min(800, Math.round(dt * STEPS_PER_SECOND))
          trail.length = 0
          for (let i = 0; i < steps; i++) step()
          draw()
          rafId = requestAnimationFrame(frame)
        }

        function start() {
          if (running) return
          running = true
          last = performance.now()
          rafId = requestAnimationFrame(frame)
        }

        function stop() {
          running = false
          cancelAnimationFrame(rafId)
        }

        document.addEventListener('visibilitychange', () => {
          if (document.hidden) stop()
          else start()
        })
        window.addEventListener('resize', resize)

        resize()
        startEpisode()
        draw()
        start()
      })()
    </script>
  </body>
</html>
