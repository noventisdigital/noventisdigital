<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noventis - The event loop preview</title>
    <style>
      :root {
        --bg: #0a0a0d;
        --text: #f1ece3;
        --muted: #aca393;
        --copper: #c4884d;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(1000px 600px at 50% 50%, rgba(196, 136, 77, 0.05), transparent 70%),
          var(--bg);
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        pointer-events: none;
        padding: 5vh 2rem 0;
        text-align: center;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.24em;
        font-size: 0.72rem;
        color: var(--muted);
        margin: 0 0 0.5rem;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: clamp(1.4rem, 3vw, 2.4rem);
        margin: 0;
      }
      .hud {
        position: absolute;
        bottom: 1.4rem;
        left: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.4rem 2.2rem;
        padding: 0 1rem;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(172, 163, 147, 0.7);
        pointer-events: none;
      }
      .hud strong {
        color: var(--copper);
        font-weight: 500;
        letter-spacing: 0.1em;
        font-variant-numeric: tabular-nums;
      }
      .hud .cap { color: rgba(172, 163, 147, 0.5); }
      .controls {
        position: absolute;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 6px;
      }
      .btn {
        appearance: none;
        background: none;
        border: 1px solid rgba(241, 236, 227, 0.18);
        border-radius: 3px;
        color: rgba(241, 236, 227, 0.78);
        font: 600 0.58rem/1 -apple-system, system-ui, sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 5px 8px;
        cursor: pointer;
      }
      .btn:hover { border-color: rgba(241, 236, 227, 0.45); }
      .btn.active { color: var(--copper); border-color: var(--copper); }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="c"></canvas>
      <div class="overlay">
        <p class="eyebrow">Preview · The event loop</p>
        <h1 id="tagline">Where the time goes.</h1>
      </div>
      <div class="controls" id="controls"></div>
      <div class="hud" id="hud">
        <span>Program <strong id="prog">–</strong></span>
        <span>Step <strong id="step">0</strong></span>
        <span class="cap">A model of the runtime · stepped slowly · the order is the real order</span>
      </div>
    </div>

    <script>
      (() => {
        const canvas = document.getElementById('c')
        const ctx = canvas.getContext('2d')
        const stage = canvas.parentElement
        const tagline = document.getElementById('tagline')
        const hudEl = document.getElementById('hud')
        const controls = document.getElementById('controls')
        const progEl = document.getElementById('prog')
        const stepEl = document.getElementById('step')
        const dpr = Math.min(window.devicePixelRatio || 1, 2)

        const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
        const SANS = '-apple-system, system-ui, sans-serif'
        const BONE = '241, 236, 227'
        const MUTED = '172, 163, 147'
        const COPPER = '196, 136, 77'
        const STEP_MS = 1000
        const MOVE_MS = 480
        const HOLD_MS = 2600
        const TITLE_H = 22

        // Each step is a full snapshot of the four boxes: s = call stack (bottom first),
        // a = Web APIs, m = microtasks, t = tasks. l = highlighted line, o = console output,
        // n = note. 'id=label' renames a block from that step on. Output order was checked in Node.
        const PROGRAMS = [
          {
            name: 'Timer and promise',
            short: 'Timer + promise',
            code: [
              "console.log('start')",
              'setTimeout(() => {',
              "  console.log('timeout')",
              '}, 0)',
              'Promise.resolve().then(() => {',
              "  console.log('promise')",
              '})',
              "console.log('end')",
            ],
            labels: { script: 'script', log: 'console.log', st: 'setTimeout', tcb: 'timeout cb', pt: '.then', pcb: 'then cb' },
            steps: [
              { l: -1, s: ['script'], n: 'The script runs as one task, top to bottom.' },
              { l: 0, s: ['script', 'log'], o: 'start' },
              { l: 1, s: ['script', 'st'], a: ['tcb'], n: 'setTimeout hands the callback to a timer.' },
              { l: 4, s: ['script', 'pt'], a: ['tcb'], m: ['pcb'], n: 'The promise is already resolved, so .then queues a microtask.' },
              { l: 7, s: ['script', 'log'], t: ['tcb'], m: ['pcb'], o: 'end', n: 'The timer has expired. Its callback waits as a task.' },
              { l: -1, s: [], t: ['tcb'], m: ['pcb'], n: 'Stack empty. Microtasks run before the next task.' },
              { l: 4, s: ['pcb'], t: ['tcb'] },
              { l: 5, s: ['pcb', 'log'], t: ['tcb'], o: 'promise' },
              { l: -1, s: [], t: ['tcb'], n: 'Microtasks drained. The loop takes one task.' },
              { l: 1, s: ['tcb'] },
              { l: 2, s: ['tcb', 'log'], o: 'timeout' },
              { l: -1, s: [], n: 'Nothing left. The loop waits.' },
            ],
          },
          {
            name: 'Timer in a microtask',
            short: 'Timer in microtask',
            code: [
              'setTimeout(() => {',
              "  console.log('timer A')",
              '}, 0)',
              'Promise.resolve().then(() => {',
              "  console.log('micro A')",
              '  setTimeout(() => {',
              "    console.log('timer B')",
              '  }, 0)',
              '  Promise.resolve().then(() => {',
              "    console.log('micro B')",
              '  })',
              '})',
              "console.log('sync')",
            ],
            labels: { script: 'script', log: 'console.log', st: 'setTimeout', pt: '.then', ta: 'timer A cb', ma: 'micro A cb', tb: 'timer B cb', mb: 'micro B cb' },
            steps: [
              { l: -1, s: ['script'], n: 'One script. Two timers, two microtasks.' },
              { l: 0, s: ['script', 'st'], a: ['ta'], n: 'Timer A starts.' },
              { l: 3, s: ['script', 'pt'], a: ['ta'], m: ['ma'], n: 'Micro A is queued now. It cannot run until the script ends.' },
              { l: 12, s: ['script', 'log'], t: ['ta'], m: ['ma'], o: 'sync', n: 'Timer A has expired and waits as a task.' },
              { l: -1, s: [], t: ['ta'], m: ['ma'], n: 'Stack empty. Microtasks first.' },
              { l: 3, s: ['ma'], t: ['ta'] },
              { l: 4, s: ['ma', 'log'], t: ['ta'], o: 'micro A' },
              { l: 5, s: ['ma', 'st'], t: ['ta'], a: ['tb'], n: 'A new timer. Its callback will queue behind timer A.' },
              { l: 8, s: ['ma', 'pt'], t: ['ta'], a: ['tb'], m: ['mb'], n: 'A microtask queued by a microtask still runs before any task.' },
              { l: -1, s: [], t: ['ta', 'tb'], m: ['mb'], n: 'Timer B has expired too. The microtask queue is checked again.' },
              { l: 8, s: ['mb'], t: ['ta', 'tb'] },
              { l: 9, s: ['mb', 'log'], t: ['ta', 'tb'], o: 'micro B' },
              { l: -1, s: [], t: ['ta', 'tb'], n: 'Microtasks drained. One task at a time, oldest first.' },
              { l: 0, s: ['ta'], t: ['tb'] },
              { l: 1, s: ['ta', 'log'], t: ['tb'], o: 'timer A' },
              { l: -1, s: [], t: ['tb'], n: 'Microtasks checked again. None. Next task.' },
              { l: 5, s: ['tb'] },
              { l: 6, s: ['tb', 'log'], o: 'timer B' },
              { l: -1, s: [], n: 'Nothing left. The loop waits.' },
            ],
          },
          {
            name: 'Fetch callback',
            short: 'Fetch',
            code: [
              "console.log('request')",
              "fetch('/api/user').then(res => {",
              "  console.log('status', res.status)",
              '})',
              'Promise.resolve().then(() => {',
              "  console.log('promise')",
              '})',
              "console.log('done')",
            ],
            labels: { script: 'script', log: 'console.log', fetch: 'fetch', req: 'request', pt: '.then', pcb: 'then cb', fcb: 'fetch then cb' },
            steps: [
              { l: -1, s: ['script'], n: 'A request goes out. The script does not wait for it.' },
              { l: 0, s: ['script', 'log'], o: 'request' },
              { l: 1, s: ['script', 'fetch'], a: ['req'], n: 'fetch hands the request to the browser and returns a pending promise.' },
              { l: 1, s: ['script', 'pt'], a: ['req'], n: '.then on a pending promise only registers the callback.' },
              { l: 4, s: ['script', 'pt'], a: ['req'], m: ['pcb'], n: 'This promise is already resolved, so its .then queues a microtask.' },
              { l: 7, s: ['script', 'log'], a: ['req'], m: ['pcb'], o: 'done' },
              { l: -1, s: [], a: ['req'], m: ['pcb'], n: 'Stack empty. Microtasks first. The request is still in flight.' },
              { l: 4, s: ['pcb'], a: ['req'] },
              { l: 5, s: ['pcb', 'log'], a: ['req'], o: 'promise' },
              { l: -1, s: [], a: ['req'], n: 'Nothing to run. The loop waits for the network.' },
              { l: -1, s: [], t: ['req=response'], n: 'The response arrives as a task.' },
              { l: 1, s: ['req'], m: ['fcb'], n: 'The task settles the promise. That queues the .then callback.' },
              { l: 1, s: ['fcb'] },
              { l: 2, s: ['fcb', 'log'], o: 'status 200' },
              { l: -1, s: [], n: 'Nothing left. The loop waits.' },
            ],
          },
        ]

        let W = 0
        let H = 0
        let area = { x: 0, y: 0, w: 0, h: 0 }
        let L = null

        let pi = 0
        let si = 0
        let acc = 0
        let holding = false
        let labelsNow = {}
        let line = -1
        let note = ''
        let consoleLines = []
        const blocks = new Map()

        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v))
        const lerp = (a, b, k) => a + (b - a) * k
        const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2)

        function measureArea() {
          const sr = stage.getBoundingClientRect()
          const tr = tagline.getBoundingClientRect()
          const hr = hudEl.getBoundingClientRect()
          const top = tr.bottom - sr.top + 16
          const bottom = hr.top - sr.top - 12
          const pad = W < 520 ? 12 : 24
          area = { x: pad, y: top, w: W - pad * 2, h: Math.max(140, bottom - top) }
        }

        function layout() {
          const a = area
          const gap = 14
          const btnH = 28
          const prog = PROGRAMS[pi]
          const narrow = a.w < 640
          const R = (x, y, w, h) => ({ x, y, w, h })
          if (!narrow) {
            const codeW = clamp(a.w * 0.34, 200, 360)
            const conW = clamp(a.w * 0.27, 170, 320)
            const boxW = a.w - codeW - conW - gap * 2
            const bx = a.x + codeW + gap
            const noteH = 40
            const boxesH = a.h - noteH
            const stackW = Math.round(boxW * 0.42)
            const qx = bx + stackW + gap
            const qW = boxW - stackW - gap
            const qH = (boxesH - gap * 2) / 3
            const cx = a.x + a.w - conW
            L = {
              code: R(a.x, a.y, codeW, a.h),
              stack: R(bx, a.y, stackW, boxesH),
              apis: R(qx, a.y, qW, qH),
              micro: R(qx, a.y + qH + gap, qW, qH),
              tasks: R(qx, a.y + 2 * (qH + gap), qW, qH),
              note: R(bx, a.y + boxesH + 8, boxW, noteH - 8),
              ctl: R(cx, a.y, conW, btnH),
              con: R(cx, a.y + btnH + 4, conW, a.h - btnH - 4),
            }
          } else {
            // Stacked. Below about 250px of room the code panel shows only the current
            // line and the four boxes sit in one row.
            const tiny = a.h < 250
            const g = tiny ? 8 : gap
            const codeH = tiny ? 30 : Math.min(a.h * 0.34, TITLE_H + prog.code.length * 15 + 10)
            const conH = tiny ? 44 : Math.max(64, a.h * 0.2)
            const noteH = tiny ? 0 : 30
            const boxesY = a.y + codeH + g
            const boxesH = Math.max(tiny ? 56 : 90, a.h - codeH - conH - btnH - g * 2 - 4 - noteH)
            let stack
            let apis
            let micro
            let tasks
            if (tiny) {
              const bw = (a.w - g * 3) / 4
              stack = R(a.x, boxesY, bw, boxesH)
              apis = R(a.x + (bw + g), boxesY, bw, boxesH)
              micro = R(a.x + 2 * (bw + g), boxesY, bw, boxesH)
              tasks = R(a.x + 3 * (bw + g), boxesY, bw, boxesH)
            } else {
              const stackW = Math.round(a.w * 0.36)
              const qx = a.x + stackW + g
              const qW = a.w - stackW - g
              const qH = (boxesH - g * 2) / 3
              stack = R(a.x, boxesY, stackW, boxesH)
              apis = R(qx, boxesY, qW, qH)
              micro = R(qx, boxesY + qH + g, qW, qH)
              tasks = R(qx, boxesY + 2 * (qH + g), qW, qH)
            }
            const cy = boxesY + boxesH + noteH + g
            L = {
              tiny,
              code: R(a.x, a.y, a.w, codeH),
              stack, apis, micro, tasks,
              note: R(a.x, boxesY + boxesH + 6, a.w, Math.max(0, noteH - 6)),
              ctl: R(a.x, cy, a.w, btnH),
              con: R(a.x, cy + btnH + 4, a.w, Math.max(40, a.y + a.h - cy - btnH - 4)),
            }
          }
          controls.style.left = L.ctl.x + 'px'
          controls.style.top = L.ctl.y + 'px'
          controls.style.width = L.ctl.w + 'px'
          // the button row may wrap; keep the console below it
          const bh = controls.offsetHeight || 0
          if (bh > btnH) {
            L.con.y += bh - btnH
            L.con.h = Math.max(36, L.con.h - (bh - btnH))
          }
        }

        function resize() {
          const r = stage.getBoundingClientRect()
          W = Math.max(1, r.width)
          H = Math.max(1, r.height)
          canvas.width = Math.floor(W * dpr)
          canvas.height = Math.floor(H * dpr)
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
          measureArea()
          layout()
          if (PROGRAMS[pi].steps[si]) placeBlocks(PROGRAMS[pi].steps[si], true)
        }

        function labelOf(id) {
          return labelsNow[id] || id
        }

        function parseIds(list) {
          return (list || []).map((entry) => {
            const eq = entry.indexOf('=')
            if (eq > 0) {
              const id = entry.slice(0, eq)
              labelsNow[id] = entry.slice(eq + 1)
              return id
            }
            return entry
          })
        }

        function slots(ids, r, mode, out) {
          const inner = { x: r.x + 8, y: r.y + TITLE_H + 4, w: r.w - 16, h: r.h - TITLE_H - 12 }
          if (mode === 'stack') {
            const n = Math.max(ids.length, 1)
            const bh = clamp((inner.h - (n - 1) * 4) / n, 12, 24)
            ids.forEach((id, i) => {
              out.set(id, { x: inner.x, y: inner.y + inner.h - (i + 1) * bh - i * 4, w: inner.w, h: bh, box: mode })
            })
            return
          }
          const bh = Math.min(22, Math.max(12, inner.h))
          let cx = inner.x
          let cy = inner.y
          ctx.font = `500 11px ${MONO}`
          ids.forEach((id) => {
            const w = Math.min(inner.w, Math.ceil(ctx.measureText(labelOf(id)).width) + 18)
            if (cx > inner.x && cx + w > inner.x + inner.w + 0.5) {
              cx = inner.x
              cy += bh + 4
            }
            out.set(id, { x: cx, y: cy, w, h: bh, box: mode })
            cx += w + 4
          })
        }

        function placeBlocks(step, instant) {
          const now = performance.now()
          const present = new Map()
          const stackIds = parseIds(step.s)
          slots(stackIds, L.stack, 'stack', present)
          slots(parseIds(step.a), L.apis, 'apis', present)
          slots(parseIds(step.m), L.micro, 'micro', present)
          slots(parseIds(step.t), L.tasks, 'tasks', present)
          const top = stackIds[stackIds.length - 1]

          for (const b of blocks.values()) {
            if (!present.has(b.id) && !b.dying) {
              const cur = currentRect(b, now)
              b.from = cur
              b.to = Object.assign({}, cur, { a: 0 })
              b.t0 = now
              b.dying = true
              b.hot = false
            }
          }
          for (const [id, rect] of present) {
            const to = { x: rect.x, y: rect.y, w: rect.w, h: rect.h, a: 1 }
            let b = blocks.get(id)
            if (!b || b.dying) {
              const from = instant ? to : { x: rect.x + rect.w * 0.15, y: rect.y + rect.h * 0.15, w: rect.w * 0.7, h: rect.h * 0.7, a: 0 }
              b = { id, from, to, t0: now, dying: false, hot: false, box: rect.box }
              blocks.set(id, b)
            } else {
              b.from = instant ? to : currentRect(b, now)
              b.to = to
              b.t0 = instant ? now - MOVE_MS : now
              b.box = rect.box
            }
            b.hot = id === top
          }
        }

        function currentRect(b, now) {
          const k = ease(clamp((now - b.t0) / MOVE_MS, 0, 1))
          return {
            x: lerp(b.from.x, b.to.x, k),
            y: lerp(b.from.y, b.to.y, k),
            w: lerp(b.from.w, b.to.w, k),
            h: lerp(b.from.h, b.to.h, k),
            a: lerp(b.from.a, b.to.a, k),
          }
        }

        function applyStep(step) {
          line = step.l
          if (step.n) note = step.n
          if (step.o != null) consoleLines.push({ text: step.o, at: performance.now() })
          placeBlocks(step, false)
          stepEl.textContent = si + 1
        }

        function startProgram(i) {
          pi = i
          si = 0
          acc = 0
          holding = false
          line = -1
          note = ''
          consoleLines = []
          blocks.clear()
          labelsNow = Object.assign({}, PROGRAMS[pi].labels)
          progEl.textContent = PROGRAMS[pi].name
          Array.from(controls.children).forEach((b, j) => b.classList.toggle('active', j === pi))
          measureArea()
          layout()
          applyStep(PROGRAMS[pi].steps[0])
        }

        // The HUD wraps differently as its values change, which moves the content area.
        let lastMeasure = 0
        function checkArea(now) {
          if (now - lastMeasure < 500) return
          lastMeasure = now
          const { y, w, h } = area
          measureArea()
          if (area.y !== y || area.w !== w || area.h !== h) {
            layout()
            placeBlocks(PROGRAMS[pi].steps[si], true)
          }
        }

        function tick(dt) {
          acc += dt
          const steps = PROGRAMS[pi].steps
          if (holding) {
            if (acc >= HOLD_MS) startProgram((pi + 1) % PROGRAMS.length)
            return
          }
          if (acc >= STEP_MS) {
            acc -= STEP_MS
            if (si + 1 < steps.length) {
              si++
              applyStep(steps[si])
            } else {
              holding = true
              acc = 0
            }
          }
        }

        function rr(x, y, w, h, r) {
          r = Math.min(r, w / 2, h / 2)
          ctx.beginPath()
          ctx.moveTo(x + r, y)
          ctx.arcTo(x + w, y, x + w, y + h, r)
          ctx.arcTo(x + w, y + h, x, y + h, r)
          ctx.arcTo(x, y + h, x, y, r)
          ctx.arcTo(x, y, x + w, y, r)
          ctx.closePath()
        }

        function tracked(text, x, y, spacing) {
          for (const ch of text) {
            ctx.fillText(ch, x, y)
            x += ctx.measureText(ch).width + spacing
          }
        }

        function panel(r, title) {
          rr(r.x, r.y, r.w, r.h, 6)
          ctx.fillStyle = '#0c0c10'
          ctx.fill()
          ctx.strokeStyle = 'rgba(255, 245, 232, 0.08)'
          ctx.lineWidth = 1
          ctx.stroke()
          if (title) {
            ctx.font = `500 9.5px ${SANS}`
            ctx.fillStyle = `rgba(${MUTED}, 0.75)`
            ctx.textAlign = 'left'
            ctx.textBaseline = 'middle'
            tracked(title.toUpperCase(), r.x + 10, r.y + TITLE_H / 2 + 1, 1.8)
          }
        }

        function fitText(text, maxW) {
          if (ctx.measureText(text).width <= maxW) return text
          let lo = 0
          let hi = text.length
          while (lo < hi) {
            const mid = (lo + hi + 1) >> 1
            if (ctx.measureText(text.slice(0, mid) + '…').width <= maxW) lo = mid
            else hi = mid - 1
          }
          return text.slice(0, lo) + '…'
        }

        function drawCode(prog) {
          const r = L.code
          const tiny = !!L.tiny
          panel(r, tiny ? '' : 'Code')
          const inner = tiny
            ? { x: r.x + 10, y: r.y + 4, w: r.w - 20, h: r.h - 8 }
            : { x: r.x + 10, y: r.y + TITLE_H + 4, w: r.w - 20, h: r.h - TITLE_H - 10 }
          const n = prog.code.length
          const lh = tiny ? inner.h : clamp(inner.h / n, 10, 18)
          let fs = Math.min(12.5, lh * 0.8)
          const gutter = 22
          ctx.font = `${fs}px ${MONO}`
          let maxW = 0
          for (const s of prog.code) maxW = Math.max(maxW, ctx.measureText(s).width)
          if (maxW > inner.w - gutter) {
            fs = Math.max(7.5, fs * ((inner.w - gutter) / maxW))
            ctx.font = `${fs}px ${MONO}`
          }
          // when the lines do not fit, keep the current line in view
          const total = n * lh
          let scroll = 0
          if (!tiny && total > inner.h) scroll = clamp(Math.max(line, 0) * lh - inner.h / 2 + lh / 2, 0, total - inner.h)
          ctx.textBaseline = 'middle'
          ctx.save()
          ctx.beginPath()
          ctx.rect(r.x, tiny ? r.y : r.y + TITLE_H, r.w, tiny ? r.h : r.h - TITLE_H)
          ctx.clip()
          const first = tiny ? Math.max(line, 0) : 0
          const lastIdx = tiny ? first : n - 1
          for (let i = first; i <= lastIdx; i++) {
            const y = tiny ? inner.y + inner.h / 2 : inner.y + i * lh + lh / 2 - scroll
            if (i === line) {
              ctx.fillStyle = `rgba(${COPPER}, 0.14)`
              ctx.fillRect(r.x + 1, y - lh / 2, r.w - 2, lh)
              ctx.fillStyle = `rgb(${COPPER})`
              ctx.fillRect(r.x + 1, y - lh / 2, 2, lh)
            }
            ctx.textAlign = 'right'
            ctx.fillStyle = `rgba(${MUTED}, 0.45)`
            ctx.fillText(String(i + 1), inner.x + 13, y)
            ctx.textAlign = 'left'
            ctx.fillStyle = i === line ? `rgb(${BONE})` : `rgba(${BONE}, 0.7)`
            ctx.fillText(prog.code[i], inner.x + gutter, y)
          }
          ctx.restore()
        }

        function drawConsole(now) {
          const r = L.con
          panel(r, 'Console')
          const inner = { x: r.x + 10, y: r.y + TITLE_H + 4, w: r.w - 20, h: r.h - TITLE_H - 10 }
          const lh = clamp(inner.h / 6, 12, 18)
          const fs = Math.min(12.5, lh * 0.8)
          const maxLines = Math.max(1, Math.floor(inner.h / lh))
          const lines = consoleLines.slice(-maxLines)
          ctx.font = `${fs}px ${MONO}`
          ctx.textBaseline = 'middle'
          ctx.textAlign = 'left'
          lines.forEach((ln, i) => {
            const y = inner.y + i * lh + lh / 2
            const k = clamp((now - ln.at) / 1400, 0, 1)
            ctx.fillStyle = `rgba(${MUTED}, 0.5)`
            ctx.fillText('›', inner.x, y)
            ctx.fillStyle = `rgb(${Math.round(lerp(196, 241, k))}, ${Math.round(lerp(136, 236, k))}, ${Math.round(lerp(77, 227, k))})`
            ctx.fillText(fitText(ln.text, inner.w - 14), inner.x + 14, y)
          })
        }

        function drawNote() {
          const r = L.note
          if (!note || r.h <= 0) return
          const fs = r.w < 300 ? 10 : 11
          ctx.font = `${fs}px ${SANS}`
          ctx.fillStyle = `rgba(${MUTED}, 0.85)`
          ctx.textAlign = 'left'
          ctx.textBaseline = 'top'
          const words = note.split(' ')
          const lines = []
          let cur = ''
          for (const w of words) {
            const t = cur ? cur + ' ' + w : w
            if (ctx.measureText(t).width > r.w - 4 && cur) {
              lines.push(cur)
              cur = w
            } else cur = t
          }
          if (cur) lines.push(cur)
          const lh = fs + 4
          const maxLines = Math.max(1, Math.floor(r.h / lh))
          lines.slice(0, maxLines).forEach((ln, i) => ctx.fillText(ln, r.x + 2, r.y + i * lh))
        }

        function drawBlocks(now) {
          ctx.textAlign = 'center'
          ctx.textBaseline = 'middle'
          for (const b of Array.from(blocks.values())) {
            const k = clamp((now - b.t0) / MOVE_MS, 0, 1)
            if (b.dying && k >= 1) {
              blocks.delete(b.id)
              continue
            }
            const c = currentRect(b, now)
            let alpha = c.a
            if (b.box === 'apis' && !b.dying) alpha *= 0.72 + 0.28 * Math.sin(now / 260)
            if (alpha <= 0.01) continue
            ctx.globalAlpha = alpha
            const col = b.hot ? COPPER : BONE
            rr(c.x, c.y, c.w, c.h, 4)
            ctx.fillStyle = `rgba(${col}, ${b.hot ? 0.16 : 0.07})`
            ctx.fill()
            ctx.strokeStyle = `rgba(${col}, ${b.hot ? 0.95 : 0.42})`
            ctx.lineWidth = 1
            ctx.stroke()
            const label = labelOf(b.id)
            let fs = Math.min(11, c.h * 0.55)
            ctx.font = `500 ${fs}px ${MONO}`
            const tw = ctx.measureText(label).width
            if (tw > c.w - 8) {
              fs = Math.max(7, fs * ((c.w - 8) / tw))
              ctx.font = `500 ${fs}px ${MONO}`
            }
            ctx.fillStyle = b.hot ? `rgb(${COPPER})` : `rgba(${BONE}, 0.92)`
            ctx.fillText(label, c.x + c.w / 2, c.y + c.h / 2 + 0.5)
            ctx.globalAlpha = 1
          }
        }

        function draw(now) {
          ctx.clearRect(0, 0, W, H)
          const prog = PROGRAMS[pi]
          drawCode(prog)
          panel(L.stack, 'Call stack')
          panel(L.apis, 'Web APIs')
          panel(L.micro, 'Microtasks')
          panel(L.tasks, 'Tasks')
          drawConsole(now)
          drawBlocks(now)
          drawNote()
        }

        PROGRAMS.forEach((p, i) => {
          const b = document.createElement('button')
          b.type = 'button'
          b.className = 'btn'
          b.textContent = p.short
          b.addEventListener('click', () => startProgram(i))
          controls.appendChild(b)
        })

        let last = 0
        let raf = 0
        function frame(now) {
          raf = 0
          if (document.hidden) return
          const dt = Math.min(64, Math.max(0, now - last))
          last = now
          checkArea(now)
          tick(dt)
          draw(now)
          raf = requestAnimationFrame(frame)
        }
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden && !raf) {
            last = performance.now()
            raf = requestAnimationFrame(frame)
          }
        })
        window.addEventListener('resize', resize)

        resize()
        startProgram(0)
        last = performance.now()
        raf = requestAnimationFrame(frame)
      })()
    </script>
  </body>
</html>
